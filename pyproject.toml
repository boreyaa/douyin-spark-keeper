[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-spark-keeper"
version = "0.1.0"
description = "WorkBuddy-oriented daily Douyin spark keeper with local state tracking"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "douyin-spark-keeper contributors"}]

[project.scripts]
douyin-spark = "douyin_spark.cli:main"

[tool.setuptools]
packages = ["douyin_spark"]
